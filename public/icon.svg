<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep space-tech gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D1A" />
      <stop offset="100%" stop-color="#1A1035" />
    </linearGradient>

    <!-- Connection line gradient (cyan → purple) -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Window outline glow -->
    <filter id="window-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00E5FF" flood-opacity="0.35" />
    </filter>

    <!-- Cyan node glow -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00E5FF" flood-opacity="0.7" />
    </filter>

    <!-- Purple node glow -->
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7C3AED" flood-opacity="0.7" />
    </filter>

    <!-- Strong glow for connection lines -->
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00E5FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded rect (tighter margins for larger icon) -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)" />

  <!-- Browser window outline -->
  <rect x="48" y="48" width="416" height="416" rx="20" ry="20"
        fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.55"
        filter="url(#window-glow)" />

  <!-- Title bar separator line -->
  <line x1="48" y1="100" x2="464" y2="100"
        stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.25" />

  <!-- moowcharnfu brand text -->
  <text x="256" y="84" font-family="'SF Mono','Courier New',monospace" font-size="16"
        fill="#00E5FF" fill-opacity="0.7" text-anchor="middle" letter-spacing="2"
        font-weight="600">moowcharnfu</text>

  <!-- Address bar -->
  <rect x="144" y="88" width="224" height="18" rx="9" ry="9"
        fill="#00E5FF" fill-opacity="0.08"
        stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.25" />

  <!-- Connection lines (M-shaped network topology) -->
  <g stroke="url(#line-grad)" stroke-width="2" stroke-opacity="0.65" fill="none"
     filter="url(#line-glow)">
    <!-- M path: left foot → left peak -->
    <line x1="140" y1="430" x2="186" y2="260" />
    <!-- left peak → center V -->
    <line x1="186" y1="260" x2="256" y2="350" />
    <!-- center V → right peak -->
    <line x1="256" y1="350" x2="326" y2="260" />
    <!-- right peak → right foot -->
    <line x1="326" y1="260" x2="372" y2="430" />
    <!-- center top → left peak -->
    <line x1="256" y1="160" x2="186" y2="260" />
    <!-- center top → right peak -->
    <line x1="256" y1="160" x2="326" y2="260" />
    <!-- center top → center V -->
    <line x1="256" y1="160" x2="256" y2="350" />
  </g>

  <!-- Network Nodes (glowing) -->

  <!-- Node 1: left foot (cyan) -->
  <circle cx="140" cy="430" r="10" fill="#00E5FF" filter="url(#glow-cyan)" />
  <circle cx="140" cy="430" r="4" fill="#fff" opacity="0.85" />

  <!-- Node 2: left peak (purple) -->
  <circle cx="186" cy="260" r="10" fill="#7C3AED" filter="url(#glow-purple)" />
  <circle cx="186" cy="260" r="4" fill="#fff" opacity="0.85" />

  <!-- Node 3: center V (cyan) -->
  <circle cx="256" cy="350" r="10" fill="#00E5FF" filter="url(#glow-cyan)" />
  <circle cx="256" cy="350" r="4" fill="#fff" opacity="0.85" />

  <!-- Node 4: right peak (purple) -->
  <circle cx="326" cy="260" r="10" fill="#7C3AED" filter="url(#glow-purple)" />
  <circle cx="326" cy="260" r="4" fill="#fff" opacity="0.85" />

  <!-- Node 5: right foot (cyan) -->
  <circle cx="372" cy="430" r="10" fill="#00E5FF" filter="url(#glow-cyan)" />
  <circle cx="372" cy="430" r="4" fill="#fff" opacity="0.85" />

  <!-- Node 6: center top (purple) -->
  <circle cx="256" cy="160" r="10" fill="#7C3AED" filter="url(#glow-purple)" />
  <circle cx="256" cy="160" r="4" fill="#fff" opacity="0.85" />
</svg>
